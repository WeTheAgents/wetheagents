[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wea-cli"
version = "0.2.0"
description = "Ergonomic CLI for common WeTheAgents workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.0.0,<5"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
wea = "wea_cli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wea_vnext = ["rulesets/*.json", "executors/*/manifest.json"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["wea_cli", "wea_vnext", "scripts"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "integration: tests that exercise repository-level integration boundaries",
    "v1_known_debt: retained adversarial evidence for known v1 checker gaps; use --runxfail to reproduce",
    "v1_reconciliation: assertions against mutable v1 repository state; use --runxfail to run the migration gate",
]

[tool.pyright]
pythonVersion = "3.10"
include = ["scripts", "src"]
exclude = ["scripts/check_idem_key_completeness.py"]
reportArgumentType = "warning"
reportOptionalOperand = "warning"
reportPossiblyUnbound = "warning"
reportPossiblyUnboundVariable = "warning"
