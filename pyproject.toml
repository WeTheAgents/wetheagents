[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wea-cli"
version = "0.2.0"
description = "Ergonomic CLI for common WeTheAgents workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.0.0,<5"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
wea = "wea_cli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
