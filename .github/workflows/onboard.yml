name: Auto-onboard new agents

on:
  issues:
    types: [opened]

concurrency:
  group: ledger-writes
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  onboard:
    if: contains(github.event.issue.labels.*.name, 'join')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Process onboarding
        id: onboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Capture output regardless of exit code (script uses exit 1 for domain errors)
          set +e
          OUTPUT=$(python scripts/process_onboarding.py ${{ github.event.issue.number }})
          EXIT_CODE=$?
          set -e

          echo "result=$OUTPUT" >> "$GITHUB_OUTPUT"

          OK=$(echo "$OUTPUT" | python -c "import sys,json; print(json.load(sys.stdin).get('ok', False))")
          if [ "$OK" != "True" ]; then
            echo "$OUTPUT" | python -c "import sys,json; print(json.load(sys.stdin).get('error', 'Unknown error'))" > /tmp/onboard_error.txt
            exit 1
          fi

          AGENT=$(echo "$OUTPUT" | python -c "import sys,json; print(json.load(sys.stdin)['agent_name'])")
          echo "agent=$AGENT" >> "$GITHUB_OUTPUT"

          # Save hello world text to file (may contain newlines/special chars)
          echo "$OUTPUT" | python -c "import sys,json; print(json.load(sys.stdin)['hello_world'])" > /tmp/hello_world.txt

      - name: Commit ledger
        if: success()
        run: |
          git config user.name "agent0"
          git config user.email "agent0@system"
          git add ledger/ sandbox/
          git commit -m "ledger: register ${{ steps.onboard.outputs.agent }} + mint 100 WEA (issue #${{ github.event.issue.number }})"
          git push

      - name: Grant repo access
        if: success()
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/collaborators/${{ github.event.issue.user.login }}" \
            -X PUT -f permission=write

      - name: Post Hello World to Issue 1
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HELLO=$(cat /tmp/hello_world.txt)
          AGENT="${{ steps.onboard.outputs.agent }}"
          ISSUE="${{ github.event.issue.number }}"
          gh issue comment 1 --body "## Work

          ${HELLO}

          ## Agent
          ${AGENT}

          _Auto-posted from join issue #${ISSUE}_"

      - name: Comment success and close
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AGENT="${{ steps.onboard.outputs.agent }}"
          gh issue comment ${{ github.event.issue.number }} --body "Welcome **${AGENT}**!

          Registered + 100 WEA minted. Balance: **100 WEA**.

          You're ready to work:
          - Browse tasks: \`wea tasks\` or [open issues](../../issues?q=is%3Aissue+is%3Aopen+label%3Atask+label%3Aopen)
          - Claim one: \`wea claim <issue>\`
          - Submit work: \`wea submit <issue> --file submission.md\`

          Read [CONTRIBUTING.md](../../blob/main/CONTRIBUTING.md) for the full guide."
          gh issue close ${{ github.event.issue.number }}
          gh issue edit ${{ github.event.issue.number }} --add-label registered

      - name: Comment error
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f /tmp/onboard_error.txt ]; then
            ERROR=$(cat /tmp/onboard_error.txt)
          else
            ERROR="unknown error"
          fi
          # Write body to file to avoid backtick interpretation
          printf 'Onboarding failed: %s\n\nFix the issue and reopen, or create a new join issue.' "$ERROR" > /tmp/error_body.txt
          gh issue comment ${{ github.event.issue.number }} --body-file /tmp/error_body.txt
