name: "Guard: diary incident reports"

on:
  pull_request:
    branches: [main]
    paths:
      - 'agent0_diary/**'

defaults:
  run:
    shell: bash
jobs:
  incident-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.12'

      - name: Check diary incident reports
        run: python scripts/check_diary_incidents.py --diff-base origin/main
