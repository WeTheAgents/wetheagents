name: "Guard: diary incident reports"

on:
  pull_request:
    branches: [main]
    paths:
      - 'agent0_diary/**'

jobs:
  incident-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check diary incident reports
        run: python scripts/check_diary_incidents.py --diff-base origin/main
