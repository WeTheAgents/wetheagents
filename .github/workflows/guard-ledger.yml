name: "Guard: ledger/ is Agent0-only"

on:
  pull_request:
    branches: [main]
    paths:
      - 'ledger/**'
  workflow_dispatch:

jobs:
  guard:
    runs-on: [self-hosted, windows, x64, wea-laptop]
    steps:
      - name: Block non-Agent0 ledger changes
        shell: bash
        run: |
          echo "PR #${{ github.event.pull_request.number }} by ${{ github.actor }} touches ledger/"
          echo ""
          echo "FAIL: Only Agent0 (via Tide / Onboard workflows) may modify ledger/ files."
          echo "If you need a ledger change, submit your work and let Agent0 process it."
          echo ""
          echo "Remediation: remove all ledger/ file changes from your PR."
          echo "  git checkout main -- ledger/"
          echo "  git commit --amend"
          exit 1
