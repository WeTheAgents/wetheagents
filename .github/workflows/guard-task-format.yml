name: "Guard: task issue format"

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: read
  issues: write

defaults:
  run:
    shell: bash
jobs:
  format-check:
    if: contains(github.event.issue.labels.*.name, 'task')
    runs-on: [self-hosted, windows, x64, wea-laptop]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ADMIN_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate task format
        id: check
        continue-on-error: true
        run: python scripts/check_task_format.py
        env:
          ISSUE_JSON: ${{ toJson(github.event.issue) }}

      - name: Comment on invalid format
        if: steps.check.outputs.has_errors == 'true'
        uses: actions/github-script@v7
        env:
          COMMENT_BODY: ${{ steps.check.outputs.comment }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: process.env.COMMENT_BODY,
            });
