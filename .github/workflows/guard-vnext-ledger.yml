name: Trusted vNext ledger guard

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Canonical pull request number to verify
        required: true
        type: string
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read
  statuses: write

jobs:
  trusted-ledger-check:
    outputs:
      number: ${{ steps.pr.outputs.number }}
      base: ${{ steps.pr.outputs.base }}
      head: ${{ steps.pr.outputs.head }}
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONPATH: src
    steps:
      - name: Checkout trusted base code only
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || 'main' }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve canonical PR identities
        id: pr
        run: python -m wea_vnext.tide resolve-pr --pull-request "$PR_NUMBER"

      - name: Fetch candidate Git objects without checking them out
        env:
          BASE_SHA: ${{ steps.pr.outputs.base }}
          CANDIDATE_SHA: ${{ steps.pr.outputs.head }}
          VERIFIED_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            fetch --no-tags origin "refs/pull/${VERIFIED_NUMBER}/head"
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE_SHA"

      - name: Validate candidate bytes with trusted base code
        env:
          BASE_SHA: ${{ steps.pr.outputs.base }}
          CANDIDATE_SHA: ${{ steps.pr.outputs.head }}
        run: >-
          python -m wea_vnext.tide guard
          --root .
          --base "$BASE_SHA"
          --head "$CANDIDATE_SHA"

  invalidate-stale-tide:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m wea_vnext.tide invalidate-pending

  merge:
    needs: trusted-ledger-check
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      statuses: read
    concurrency:
      group: wea-canonical-tide
      cancel-in-progress: false
    if: github.repository == 'WeTheAgents/wetheagents' && needs.trusted-ledger-check.result == 'success' && github.ref == 'refs/heads/main' && vars.TIDE_MERGE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: tide-merge
    env:
      VERIFIED_NUMBER: ${{ needs.trusted-ledger-check.outputs.number }}
      VERIFIED_BASE: ${{ needs.trusted-ledger-check.outputs.base }}
      VERIFIED_HEAD: ${{ needs.trusted-ledger-check.outputs.head }}
      PYTHONPATH: src
      GITHUB_TOKEN: ${{ github.token }}
      TIDE_MERGE_ENABLED: ${{ vars.TIDE_MERGE_ENABLED }}
      TIDE_ROLLOUT_FLOOR: '1064'
      TIDE_POLICY_HASH: 'a645ec1c9143206cc40516108e8611af8229d817fb8522f10bb08578d9e2175e'
      TIDE_STATUS_INTEGRATION_ID: '15368'
      TIDE_STATUS_ACTOR_ID: '41898282'
      TIDE_MERGER_APP_ID: '5236324'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Bind candidate to the successful guard outputs
        id: candidate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.tide_merge_preflight import guarded_request
          from wea_vnext.tide.github import GitHub
          from wea_vnext.tide.ledger import git
          request = guarded_request(
              GitHub(os.environ['GITHUB_TOKEN']), int(os.environ['VERIFIED_NUMBER']),
              base=os.environ['VERIFIED_BASE'], head=os.environ['VERIFIED_HEAD'],
              floor=int(os.environ['TIDE_ROLLOUT_FLOOR']),
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'present={str(request is not None).lower()}\n')
          if request is not None:
              if git(Path.cwd(), 'rev-parse', 'HEAD') != request['base']:
                  raise SystemExit('Trusted checkout is stale')
              Path('tide-merge-request.json').write_text(json.dumps(request))
          PY
      - name: Fetch candidate as data and perform authenticated replay
        if: steps.candidate.outputs.present == 'true'
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          from wea_vnext.tide.ledger import git
          data = json.loads(Path('tide-merge-request.json').read_text())
          number = int(data['number'])
          # Canonical repository is public. No credentials are persisted.
          subprocess.run(['git', 'fetch', '--no-tags', 'origin', f'refs/pull/{number}/head'], check=True)
          if git(Path.cwd(), 'rev-parse', 'FETCH_HEAD') != data['head']:
              raise SystemExit('Candidate moved while fetching')
          PY
          python -m scripts.tide_merge --request tide-merge-request.json
      - name: Mint repository-scoped short-lived merge token
        if: steps.candidate.outputs.present == 'true'
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: '5236324'
          private-key: ${{ secrets.TIDE_MERGER_PRIVATE_KEY }}
          owner: WeTheAgents
          repositories: wetheagents
          permission-contents: write
      - name: Revalidate, merge exact head once, and retain readback
        if: steps.candidate.outputs.present == 'true'
        env:
          TIDE_MERGE_TOKEN: ${{ steps.app.outputs.token }}
          TIDE_INSTALLATION_ID: ${{ steps.app.outputs.installation-id }}
        run: |
          set -euo pipefail
          test "$TIDE_INSTALLATION_ID" = '169219742'
          python -m scripts.tide_merge --request tide-merge-request.json --execute | tee tide-merge-result.json
          cat tide-merge-result.json >> "$GITHUB_STEP_SUMMARY"
