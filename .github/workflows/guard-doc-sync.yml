name: "Guard: doc-sync drift"

on:
  pull_request:
    branches: [main]

defaults:
  run:
    shell: bash
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.12'
      - name: Check doc sync
        run: python scripts/check_doc_sync.py
