name: "Guard: doc-sync drift"

on:
  pull_request:
    branches: [main]

defaults:
  run:
    shell: bash
jobs:
  validate:
    runs-on: [self-hosted, windows, x64, wea-laptop]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ADMIN_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check doc sync
        run: python scripts/check_doc_sync.py
