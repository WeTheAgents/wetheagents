name: "Integrity Sweep"

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  integrity-sweep:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify required scripts exist
        run: |
          test -f scripts/check_invariant.py
          test -f scripts/check_claim_ttl.py
          test -f scripts/check_concurrent_claims.py
          test -f scripts/check_cross_file_integrity.py
          test -f scripts/check_ledger_schema.py
          test -f scripts/check_doc_sync.py
          test -f scripts/check_genome_trailer.py

      - name: Check invariant
        run: python scripts/check_invariant.py --root .

      - name: Check claim TTL
        run: python scripts/check_claim_ttl.py --root . --repo "$REPO"

      - name: Check concurrent claims
        run: python scripts/check_concurrent_claims.py --root . --repo "$REPO"

      - name: Check cross-file integrity
        run: python scripts/check_cross_file_integrity.py --root . --repo "$REPO"

      - name: Check ledger schema
        run: python scripts/check_ledger_schema.py --root .

      - name: Check doc sync
        run: python scripts/check_doc_sync.py --root .

      - name: Check genome trailer
        run: python scripts/check_genome_trailer.py --root .
