name: "Auto-Triage: daily issue health scan"

on:
  schedule:
    # Run once daily at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  issues: write

defaults:
  run:
    shell: bash
jobs:
  triage:
    runs-on: [self-hosted, windows, x64, wea-laptop]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ADMIN_TOKEN }}

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.12'

      - name: Run auto-triage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/auto_triage.py
