name: "Guard: ledger JSON schema"

on:
  push:
    branches: [main]
    paths:
      - 'ledger/**'
  pull_request:
    branches: [main]
    paths:
      - 'ledger/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate ledger JSON schema
        run: python scripts/check_ledger_schema.py
