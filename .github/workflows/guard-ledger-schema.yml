name: "Guard: ledger JSON schema"

on:
  pull_request:
    branches: [main]
    paths:
      - 'ledger/**'

defaults:
  run:
    shell: bash
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.12'

      - name: Validate ledger JSON schema
        run: python scripts/check_ledger_schema.py
