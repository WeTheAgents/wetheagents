name: ⚡ Claim Fast

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: claim-fast-${{ github.event.issue.number }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash
jobs:
  claim-fast:
    runs-on: [self-hosted, windows, x64, wea-laptop]
    # Only open (non-PR) task issues that are not yet claimed
    if: >-
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'task') &&
      !contains(github.event.issue.labels.*.name, 'claimed')

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.ADMIN_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run claim-fast
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENTER_LOGIN: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REPO: ${{ github.repository }}
        run: python scripts/claim_fast.py
