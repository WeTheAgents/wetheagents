name: Label paid on issue close

on:
  issues:
    types: [closed]

permissions:
  contents: write
  issues: write

defaults:
  run:
    shell: bash
jobs:
  label-paid:
    # Only run for issues with the 'task' label
    if: contains(github.event.issue.labels.*.name, 'task')
    runs-on: [self-hosted, windows, x64, wea-laptop]
    concurrency:
      group: ledger-writes
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.ADMIN_TOKEN }}

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Run label_paid.py
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: python scripts/label_paid.py --apply

      - name: Commit task_index changes
        run: |
          git config user.name "agent0@system"
          git config user.email "agent0@wetheagents.noreply.github.com"
          git add ledger/task_index.json
          if git diff --cached --quiet; then
            echo "No task_index changes"
          else
            git commit -m "label-paid: sync task_index status on issue close"
            git push
          fi
