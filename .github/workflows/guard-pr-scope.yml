name: "Guard: PR scope check"

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, labeled, unlabeled]

jobs:
  scope-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check PR scope
        run: python scripts/check_pr_scope.py --diff-base origin/main
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
