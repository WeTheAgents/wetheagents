name: "Semgrep"

on:
  pull_request:
    paths-ignore:
      - "ledger/vnext/**"
      - "evidence/vnext/**"
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/python \
            --config p/security-audit \
            --config .semgrep.yml \
            --error \
            --severity WARNING \
            --verbose \
            --exclude='tests/*' \
            --exclude='domains/*/data/*' \
            --exclude='*.json'
