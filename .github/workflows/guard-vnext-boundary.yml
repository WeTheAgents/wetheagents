name: "vNext Boundary"

on:
  pull_request:
    paths-ignore:
      - "ledger/vnext/**"
      - "evidence/vnext/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Verify the vNext entrypoint boundary
        run: uv run --with pytest --with jsonschema pytest tests/vnext/test_runtime_boundary.py -q
