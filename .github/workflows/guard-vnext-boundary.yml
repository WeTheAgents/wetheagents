name: "vNext Boundary"

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Verify the inactive vNext boundary
        run: uv run --with pytest --with jsonschema pytest tests/vnext/test_runtime_boundary.py -q
