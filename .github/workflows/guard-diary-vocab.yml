name: "Guard: diary vocabulary"

on:
  pull_request:
    branches: [main]
    paths:
      - "agent0_diary/**"

defaults:
  run:
    shell: bash
jobs:
  vocab-check:
    runs-on: [self-hosted, windows, x64, wea-laptop]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ADMIN_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check diary vocabulary
        run: python scripts/censor_diary.py --check
