name: "Master Sweep"

# Runs scripts/run_all_checks.py — the master integration runner that
# discovers and executes every scripts/check_*.py. Failures outside the
# Stabilization allowlist (.github/sweep-allowlist.json) cause the job to
# fail, surfacing ledger drift the moment it lands on main.
#
# The allowlist is a TEMPORARY scaffold tied to issues #894-#900. As each
# Stabilization cluster closes, its entries must be removed from the
# allowlist so regressions in those checkers turn red again.

on:
  push:
    branches: [main]
  schedule:
    # Daily at 09:00 UTC, 1h after integrity-sweep, so the broader sweep
    # runs even on days with no push to main.
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  master-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify required files exist
        run: |
          test -f scripts/run_all_checks.py
          test -f .github/sweep-allowlist.json

      - name: Run master sweep
        id: sweep
        run: |
          # run_all_checks.py exits 1 when any check fails.  We need its
          # JSON output regardless of exit code, so we tee to a file and
          # ignore the exit code here — the post-processing step below
          # decides pass/fail using the allowlist.
          python scripts/run_all_checks.py --json > sweep_output.json || true
          echo "wrote $(wc -l < sweep_output.json) lines to sweep_output.json"

      - name: Apply allowlist and write summary
        env:
          SWEEP_OUTPUT: sweep_output.json
          ALLOWLIST: .github/sweep-allowlist.json
          REPO: ${{ github.repository }}
        run: |
          python <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          repo = os.environ.get("REPO", "")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          sweep_path = Path(os.environ["SWEEP_OUTPUT"])
          allow_path = Path(os.environ["ALLOWLIST"])

          try:
              sweep = json.loads(sweep_path.read_text(encoding="utf-8"))
          except (FileNotFoundError, json.JSONDecodeError) as exc:
              print(f"::error::could not parse sweep output: {exc}")
              sys.exit(2)

          allow_doc = json.loads(allow_path.read_text(encoding="utf-8"))
          allowlist = allow_doc.get("allowed_failures", {})

          results = sweep.get("results", [])
          passed = [r for r in results if r["status"] == "pass"]
          failed = [r for r in results if r["status"] == "fail"]
          skipped = [r for r in results if r["status"] == "skip"]

          # Partition failures into expected (allowlisted) vs unexpected.
          unexpected = [r for r in failed if r["script"] not in allowlist]
          expected = [r for r in failed if r["script"] in allowlist]

          # Detect stale allowlist entries — checkers that now PASS but
          # are still listed.  These do not fail the job, but we surface
          # them so the next Stabilization commit can remove them.
          passing_names = {r["script"] for r in passed}
          stale = sorted(name for name in allowlist if name in passing_names)

          # Build the GitHub step summary.
          lines = []
          lines.append("# Master Sweep")
          lines.append("")
          lines.append(f"- total: **{len(results)}**")
          lines.append(f"- pass: **{len(passed)}**")
          lines.append(f"- fail: **{len(failed)}**  (allowlisted: {len(expected)}, unexpected: {len(unexpected)})")
          lines.append(f"- skip: **{len(skipped)}**")
          lines.append("")

          def _issue_link(name: str) -> str:
              meta = allowlist.get(name) or {}
              issue = meta.get("issue")
              if issue and repo:
                  return f"[#{issue}](https://github.com/{repo}/issues/{issue})"
              if issue:
                  return f"#{issue}"
              return "(no issue)"

          if unexpected:
              lines.append("## Unexpected failures (job will fail)")
              lines.append("")
              for r in unexpected:
                  lines.append(f"- `{r['script']}` — {r.get('first_line','')}")
              lines.append("")

          if expected:
              lines.append("## Allowlisted failures (Stabilization sprint)")
              lines.append("")
              lines.append("| Checker | Cluster | Issue |")
              lines.append("| --- | --- | --- |")
              for r in expected:
                  meta = allowlist.get(r["script"], {})
                  cluster = meta.get("cluster", "?")
                  lines.append(f"| `{r['script']}` | {cluster} | {_issue_link(r['script'])} |")
              lines.append("")

          if stale:
              lines.append("## Stale allowlist entries (now passing — please remove)")
              lines.append("")
              for name in stale:
                  lines.append(f"- `{name}` — {_issue_link(name)}")
              lines.append("")

          if skipped:
              lines.append("## Skipped (need external context — not scored)")
              lines.append("")
              for r in skipped:
                  lines.append(f"- `{r['script']}`")
              lines.append("")

          summary_text = "\n".join(lines) + "\n"
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as fh:
                  fh.write(summary_text)
          else:
              print(summary_text)

          # Console output for log readers who do not open the summary tab.
          print(f"pass={len(passed)} fail={len(failed)} skip={len(skipped)}")
          print(f"unexpected_failures={len(unexpected)} allowlisted={len(expected)} stale_allowlist={len(stale)}")
          for r in unexpected:
              print(f"::error file=scripts/{r['script']}::unexpected sweep failure: {r.get('first_line','')}")

          # Job fails ONLY on unexpected failures.  Skips never fail.  Stale
          # allowlist entries are a soft warning.
          sys.exit(1 if unexpected else 0)
          PY
