name: btc-snapshot

# Manual, read-only rebuild of the BTC dashboard.
#
# Uses the vendored copy of btc_dashboard at vendor/btc_dashboard/
# (upstream repo is private, so cross-repo actions/checkout with
# GITHUB_TOKEN fails — vendoring is the no-secrets workaround).
# The result is an Actions artifact. It cannot advance canonical main while
# the private vNext pilot is stopped or create a hidden canonical writer.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btc-snapshot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout wetheagents
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install vendored btc_dashboard dependencies
        run: npm ci
        working-directory: vendor/btc_dashboard

      - name: Build snapshot
        run: node scripts/btc_snapshot_build.js

      - name: Upload the non-canonical snapshot
        uses: actions/upload-artifact@v4
        with:
          name: btc-snapshot-${{ github.run_id }}
          path: |
            docs/btc
            data/btc_history.jsonl
