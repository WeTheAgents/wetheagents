name: btc-snapshot

# Daily static rebuild of the BTC dashboard.
#
# Uses the vendored copy of btc_dashboard at vendor/btc_dashboard/
# (upstream repo is private, so cross-repo actions/checkout with
# GITHUB_TOKEN fails — vendoring is the no-secrets workaround).
# Writes the results into docs/btc/ + data/btc_history.jsonl and
# commits the diff. Cloudflare Worker serves docs/ so the new
# snapshot is live immediately after push.

on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC daily
  workflow_dispatch:      # manual trigger via "Run workflow" or gh CLI

permissions:
  contents: write         # needed to commit the generated files

concurrency:
  group: btc-snapshot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout wetheagents
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install vendored btc_dashboard dependencies
        run: npm ci
        working-directory: vendor/btc_dashboard

      - name: Build snapshot
        run: node scripts/btc_snapshot_build.js

      - name: Commit snapshot
        run: |
          git config user.name  "agent0"
          git config user.email "agent0@system"
          git add docs/btc data/btc_history.jsonl
          if git diff --cached --quiet; then
            echo "No changes — snapshot identical to previous run"
            exit 0
          fi
          git commit -m "btc-snapshot: $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git push
