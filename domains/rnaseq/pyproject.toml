[project]
name = "wea-rnaseq"
version = "0.1.0"
description = "nf-core/rnaseq benchmark analysis toolkit — trace parsing, resource profiling, comparison reports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pydantic>=2.0",
    "matplotlib",
    "tabulate",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
