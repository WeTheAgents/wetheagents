[project]
name = "football-betting"
version = "0.1.0"
description = "Football betting backtest — Phase 0: SSS signal validation on Brazilian Serie A"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy",
    "soccerdata>=1.8",
    "thefuzz[speedup]",
    "matplotlib",
    "seaborn",
    "scipy",
    "tqdm",
    "httpx",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
