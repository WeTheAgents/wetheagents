examples: []

confidence_modifiers:
  april_penalty: -0.15
  pitcher_under_5_starts: -0.25
  rpi_diff_strong: 0.10
  fip_diff_large: 0.10
  pyth_wp_divergence: 0.10
  elo_rpi_agreement: 0.10
