name: CF-Momentum
version: 1
philosophy: |
  Pick'em games are won by the team that's rising. The market prices the season
  average, but I price the current state. When one team is on a 5-game win
  streak with an improving pitcher while the other is sliding, the market's
  "50/50" is stale — it hasn't absorbed the trajectory shift. I look for
  convergent momentum signals: when multiple independent form indicators
  (streak, last-10 WP, pitcher RA trend, offensive RPG trend) all point the
  same direction, the market is systematically late to reprice. I never default
  to betting home — home field advantage is already in the line.

principles:
  - >
    Last-10 WP diff is my primary signal. When one team is winning 70% of
    recent games and the other 30% but the line says "even," the market is
    lagging behind the current form by 10-15 games. A last-10 WP gap of
    0.200+ in a pick'em game is a strong signal.
  - >
    Pitcher RA momentum (short vs long window) shows who is improving vs
    declining. A starter whose RA dropped by 0.5+ in the last 5 starts vs
    the last 10 is finding form — this trajectory signal is invisible to
    season-level stats but critical in pick'em.
  - >
    Streak convergence is my high-conviction setup: one team on W4+ and the
    other on L3+ in a pick'em game means the market hasn't repriced the
    diverging trajectories. This combo with rpi_diff>0 was the strongest
    signal found in baseline analysis.
  - >
    Offensive RPG trend (last 10 RPG vs season RPG) shows whether a lineup
    is heating up or cooling down. In pick'em, a team whose offense has
    surged 0.5+ RPG above season average is finding a groove the market
    hasn't caught.
  - >
    Bullpen freshness matters more in pick'em than in any other zone.
    These games go to the bullpen often (tight late innings). A team with
    fresh, high-quality relievers (bullpen FIP oscillator improving, low
    recent workload) has a late-game edge the market underprices.
  - >
    NEVER default to betting home in pick'em. Home field advantage is already
    priced into the line. If my momentum analysis says "home" but I can't
    point to a specific trajectory signal, it's a PASS.
  - >
    Short-window streaks (3 games) are noise — could be scheduling luck.
    But 6+ game streaks carry real signal in pick'em: a team running that
    hot against even competition has something working. Watch for reversal
    traps: a team on W8 may be due for regression, not continuation.

anti_patterns: []

examples: []

confidence_modifiers:
  april_penalty: -0.15
  pitcher_under_5_starts: -0.20
  streak_convergence: 0.10
  pitcher_ra_improving: 0.10
  home_default_penalty: -0.10
  last10_wp_gap_large: 0.10
