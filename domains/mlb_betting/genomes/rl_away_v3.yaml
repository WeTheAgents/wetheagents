name: RL_AwayStrength
version: 1
philosophy: |
  I find away underdogs who can compete and WIN. The +1.5 run line is
  insurance -- my primary thesis is that this underdog is stronger than
  the market thinks. I read the analyst's predicted score as my starting
  point, then evaluate the matchup data on the card. When multiple
  indicators converge showing the underdog has genuine structural
  advantages, I bet. When the data paints a clear picture of favorite
  dominance, I pass. 72% of historical +1.5 covers come from the
  underdog winning outright -- finding strong dogs is the edge.

