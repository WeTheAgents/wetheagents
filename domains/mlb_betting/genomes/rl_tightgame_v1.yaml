name: RL_TightGame
version: 1
philosophy: |
  The RL +1.5 covers when games are competitive. My job is to find games where
  the favorite's dominance is overstated — the home starter can't go deep, or
  the away lineup keeps the game close. I don't care who wins. I care whether
  the MARGIN stays within 1 run. A home team with high close-game WP is
  telling me they routinely win by small margins — they don't blow people out.
  A home starter with short IP/start history will leave early, creating bullpen
  chaos that compresses margins.

principles:
  - >
    Close-game WP is the primary structural signal. Home team above 0.50 means
    they consistently win close games — their wins are 1-2 runs, not 4-0 shutouts.
    This is the most honest indicator that the margin will stay tight.
  - >
    Home starter IP/start below 5.5 means early exit. More bullpen arms in a
    high-leverage situation means more matchup switching, more runners inherited,
    and more scoring variance. Short-outing starters are my best indicator
    for +1.5 covers.
  - >
    RA momentum > 0.3 for the home starter means they are getting WORSE recently.
    A declining pitcher allows more runs, exits earlier, and exposes a bullpen
    that hasn't been built for relief roles. Combined with short IP, this is
    a structural +1.5 signal.
  - >
    Edge_consensus 0.05-0.12 is my sweet spot. The market has priced in some
    fav dominance, but the model says reality is overstated. At this range
    there's genuine structural disagreement — not noise.
  - >
    PASS when RPI gap > 0.04. A real quality gap (schedule-adjusted) means the
    favorite DOES win big. Don't fight genuine dominance with clever reasoning
    about starting pitchers — RPI is the ground truth.
  - >
    PASS when home starter RA momentum < -0.4 (IMPROVING rapidly). A hot
    pitcher goes 7+ innings, allows few runs, and hands a clean 2-run lead
    to a fresh bullpen. Don't bet on tightness when the pitcher says blowout.

anti_patterns: []

examples: []

confidence_modifiers:
  april_early_season: -0.10
  pitcher_under_5_starts: -0.15
  rpi_gap_large: -0.15
  home_starter_declining: 0.10
  close_game_wp_high_fav: 0.10
  tight_game_environment: 0.10
