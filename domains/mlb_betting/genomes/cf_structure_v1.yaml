examples: []

confidence_modifiers:
  april_penalty: -0.15
  pitcher_under_5_starts: -0.20
  rpi_elo_agreement: 0.10
  pyth_wp_divergence: 0.10
  home_default_penalty: -0.10
  fip_diff_large: 0.10
