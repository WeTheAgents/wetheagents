name: "CI"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyarrow
          python -m pip install -e ".[dev]"

      - name: Run test suite
        run: |
          pytest tests/test_strategies.py -v
          pytest tests/test_generate_picks.py -v
          pytest tests/test_live_strategy_audit.py -v
          pytest tests/test_repeat_series_signal_analysis.py -v
          pytest tests/test_under_totals_data.py -v
          pytest tests/test_orchestrator_dedup.py -v
          pytest tests/test_live_features.py -v
          pytest tests/test_retrosheet_mapping.py -v
          pytest tests/test_savant_sync.py -v
