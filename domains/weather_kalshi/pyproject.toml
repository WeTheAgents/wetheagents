[project]
name = "weather-kalshi"
version = "0.1.0"
description = "Weather prediction market trading for Kalshi temperature contracts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Data
    "pandas>=2.0",
    "numpy",
    "pyarrow",
    # HTTP
    "httpx",
    # Stats
    "scipy",
    # ML (Phase 2)
    "scikit-learn",
    # Visualization
    "matplotlib",
    "seaborn",
    # Weather model data (NBM via GRIB2)
    "herbie-data",
    # Utils
    "tqdm",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "ipykernel",
    "jupyter",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
