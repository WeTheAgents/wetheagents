[project]
name = "wea-poker"
version = "0.1.0"
description = "WEA Poker Bot — autonomous agent for PokerNow.com tournaments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "treys",
    "selenium",
    "webdriver-manager",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
