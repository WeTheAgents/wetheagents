[project]
name = "bitgn-agent"
version = "0.1.0"
description = "WeTheAgents agent for BitGN Sandbox benchmark"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bitgn-api-connectrpc-python==0.8.1.1.20260316101438+5e72a3f6bebf",
    "bitgn-api-protocolbuffers-python==34.0.0.1.20260316101438+5e72a3f6bebf",
    "anthropic>=0.52.0",
    "openai>=2.26.0",
    "pydantic>=2.12.5",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
]

[[tool.uv.index]]
url = "https://buf.build/gen/python"

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
