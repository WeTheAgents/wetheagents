[project]
name = "bitgn-agent"
version = "0.1.0"
description = "WeTheAgents agent for BitGN Sandbox benchmark"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bitgn-api-connectrpc-python==0.9.0.1.20260324104753+6b18c777b19a",
    "bitgn-api-protocolbuffers-python==34.1.0.1.20260324104753+6b18c777b19a",
    "anthropic>=0.52.0",
    "openai>=2.26.0",
    "pydantic>=2.12.5",
    "protobuf>=7.34.1",
    "python-dotenv",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
]

[[tool.uv.index]]
url = "https://buf.build/gen/python"

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
